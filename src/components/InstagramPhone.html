<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhone 17 Pro Max – klinik_demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --ig-font: -apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --ig-black: #0a0a0a;
  --ig-dark: #262626;
  --ig-medium: #8e8e8e;
  --ig-light: #c7c7c7;
  --ig-border: #dbdbdb;
  --ig-bg: #fafafa;
  --ig-blue: #0095f6;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  width: 100%;
  min-height: 100vh;
  background: #0d0d12;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--ig-font);
  /* subtle noise texture */
  background-image:
    radial-gradient(ellipse 80% 60% at 30% 40%, rgba(28,28,58,0.9) 0%, transparent 70%),
    radial-gradient(ellipse 60% 80% at 80% 70%, rgba(15,15,35,0.95) 0%, transparent 70%);
}

/* ============================================================
   IPHONE 17 PRO MAX FRAME
   - 6.9" screen, titanium frame, thinner bezels than 16
   - Dynamic Island evolved (narrower pill)
   - Matte titanium finish sides
   ============================================================ */
.phone-wrap {
  position: relative;
  padding: 70px 40px;
}

/* Glow under phone */
.phone-wrap::before {
  content: '';
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 280px;
  height: 40px;
  background: radial-gradient(ellipse, rgba(80,80,180,0.35) 0%, transparent 70%);
  filter: blur(12px);
}

.iphone {
  position: relative;
  width: 393px;
  height: 852px;
  /* Titanium Pro Max body */
  background:
    linear-gradient(175deg,
      #5a5a5c 0%,
      #48484a 3%,
      #3a3a3c 8%,
      #2c2c2e 20%,
      #1c1c1e 42%,
      #111113 68%,
      #161618 85%,
      #222224 95%,
      #2e2e30 100%);
  border-radius: 62px;
  /* Multi-layer shadows for depth */
  box-shadow:
    /* outer edge highlight */
    0 0 0 0.5px rgba(255,255,255,0.18),
    /* titanium border */
    0 0 0 1.5px rgba(120,120,125,0.6),
    /* dark gap */
    0 0 0 3px rgba(0,0,0,0.95),
    /* deep drop shadow */
    0 80px 200px rgba(0,0,0,0.98),
    0 30px 80px rgba(0,0,0,0.8),
    0 8px 30px rgba(0,0,0,0.6),
    /* side catch light */
    18px 0 50px rgba(0,0,0,0.4),
    -4px 0 25px rgba(255,255,255,0.02);
  padding: 16px;
  isolation: isolate;
}

/* Titanium edge catch-light — top/left bright */
.iphone::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 62px;
  background: linear-gradient(148deg,
    rgba(255,255,255,0.28) 0%,
    rgba(255,255,255,0.10) 8%,
    rgba(255,255,255,0.02) 22%,
    transparent 40%,
    transparent 70%,
    rgba(255,255,255,0.04) 88%,
    rgba(255,255,255,0.08) 100%);
  pointer-events: none;
  z-index: 200;
}

/* Right-side titanium band shimmer */
.iphone::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 62px;
  background: linear-gradient(90deg,
    transparent 0%,
    transparent 93%,
    rgba(255,255,255,0.06) 96%,
    rgba(255,255,255,0.12) 100%);
  pointer-events: none;
  z-index: 200;
}

/* ── Physical buttons ── */
/* Silent/mute toggle */
.btn-mute {
  position: absolute; left: -3px; top: 130px;
  width: 3px; height: 34px; border-radius: 2px 0 0 2px;
  background: linear-gradient(90deg, #0c0c0e, #2a2a2c, #1a1a1c);
  box-shadow: -2px 0 4px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.06);
}
/* Volume up */
.btn-vol-u {
  position: absolute; left: -3px; top: 184px;
  width: 3px; height: 68px; border-radius: 2px 0 0 2px;
  background: linear-gradient(90deg, #0c0c0e, #2a2a2c, #1a1a1c);
  box-shadow: -2px 0 4px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.06);
}
/* Volume down */
.btn-vol-d {
  position: absolute; left: -3px; top: 266px;
  width: 3px; height: 68px; border-radius: 2px 0 0 2px;
  background: linear-gradient(90deg, #0c0c0e, #2a2a2c, #1a1a1c);
  box-shadow: -2px 0 4px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.06);
}
/* Power / lock */
.btn-power {
  position: absolute; right: -3px; top: 218px;
  width: 3px; height: 86px; border-radius: 0 2px 2px 0;
  background: linear-gradient(270deg, #0c0c0e, #2a2a2c, #1a1a1c);
  box-shadow: 2px 0 4px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.06);
}

/* ── Screen ── */
.screen {
  position: relative;
  width: 100%; height: 100%;
  background: #000;
  border-radius: 48px;
  overflow: hidden;
}

/* Screen glass sheen */
.screen-glare {
  position: absolute;
  inset: 0;
  border-radius: 48px;
  background: linear-gradient(128deg,
    rgba(255,255,255,0.055) 0%,
    rgba(255,255,255,0.012) 18%,
    transparent 36%,
    transparent 100%);
  pointer-events: none;
  z-index: 300;
}

/* ── Dynamic Island (iPhone 17 Pro — narrower, taller pill) ── */
.dynamic-island {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 108px;
  height: 34px;
  background: #000;
  border-radius: 20px;
  z-index: 150;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  /* subtle inner shadow to blend with screen */
  box-shadow: 0 0 0 1.5px rgba(0,0,0,0.9), inset 0 0 8px rgba(0,0,0,0.8);
}
.di-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #1a304a 50%, #040408);
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 0 0 2px rgba(10,80,180,0.12);
}
.di-dot.small {
  width: 7px; height: 7px;
  background: radial-gradient(circle at 40% 40%, #111a24, #030306);
  box-shadow: none;
}

/* ── Status bar ── */
.status-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 56px;
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 0 30px 8px;
  /* Transparent — renders over white IG header */
}
.sb-time {
  font-size: 15px;
  font-weight: 700;
  color: #1a1a1a;
  letter-spacing: -0.3px;
  font-family: var(--ig-font);
}
.sb-icons {
  display: flex; align-items: center; gap: 6px;
}
.sb-icons svg { display: block; }


/* ============================================================
   INSTAGRAM UI — pixel-perfect replica
   Fonts: SF Pro Text (falls back to system)
   ============================================================ */
.ig-app {
  position: absolute;
  inset: 0;
  background: var(--ig-bg);
  display: flex;
  flex-direction: column;
  padding-top: 56px; /* status bar height */
}

/* ── Top header ── */
.ig-top {
  height: 44px;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 0.5px solid var(--ig-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  flex-shrink: 0;
}
.ig-wordmark {
  font-family: 'Dancing Script', 'Lucida Calligraphy', cursive;
  font-size: 24px;
  font-weight: 700;
  color: var(--ig-black);
  letter-spacing: -0.5px;
  line-height: 1;
}
.ig-top-icons {
  display: flex; align-items: center; gap: 20px;
}
.ig-icon { display: block; width: 24px; height: 24px; }

/* ── Stories ── */
.ig-stories-row {
  background: #fff;
  border-bottom: 0.5px solid var(--ig-border);
  display: flex;
  align-items: center;
  padding: 10px 4px;
  gap: 2px;
  flex-shrink: 0;
  overflow: hidden;
}
.story-cell {
  display: flex; flex-direction: column;
  align-items: center; gap: 4px;
  width: 74px; flex-shrink: 0; cursor: pointer;
}
.story-ring-wrap {
  width: 62px; height: 62px; border-radius: 50%;
  padding: 2.5px;
  background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
  position: relative;
}
.story-ring-wrap.seen {
  background: var(--ig-border);
}
.story-ring-wrap.add-btn {
  background: linear-gradient(135deg, #f0f0f0, #e0e0e0);
}
.story-ring-inner {
  width: 100%; height: 100%; border-radius: 50%;
  background: #fff;
  border: 2px solid #fff;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  font-size: 18px; font-weight: 900;
  color: #555;
}
.story-avatar {
  width: 100%; height: 100%; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 800; color: #fff;
}
.story-add-icon {
  width: 20px; height: 20px;
  background: var(--ig-blue);
  border-radius: 50%;
  border: 2px solid #fff;
  display: flex; align-items: center; justify-content: center;
  position: absolute;
  bottom: 0; right: 0;
}
.story-add-icon::before, .story-add-icon::after {
  content: ''; position: absolute;
  background: #fff; border-radius: 1px;
}
.story-add-icon::before { width: 9px; height: 1.5px; }
.story-add-icon::after  { width: 1.5px; height: 9px; }
.story-name {
  font-size: 10.5px;
  color: var(--ig-dark);
  font-family: var(--ig-font);
  font-weight: 400;
  text-align: center;
  width: 70px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  letter-spacing: -0.1px;
}
.story-name.you { font-weight: 500; }

/* ── Feed divider ── */
.feed-separator {
  height: 4px;
  background: var(--ig-border);
  flex-shrink: 0;
}

/* ── Post ── */
.ig-post { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; background: #fff; }

/* Post header */
.post-header {
  display: flex; align-items: center;
  padding: 10px 14px 8px;
  flex-shrink: 0;
  gap: 10px;
}
.post-avatar-ring {
  width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
  padding: 2px;
  cursor: pointer;
}
.post-avatar-inner {
  width: 100%; height: 100%; border-radius: 50%;
  background: #fff; border: 2px solid #fff;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.post-avatar-letter {
  width: 86%; height: 86%; border-radius: 50%;
  background: linear-gradient(135deg, #405de6, #5851db, #833ab4, #c13584, #e1306c, #fd1d1d);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 800; color: #fff;
  font-family: var(--ig-font);
}
.post-user-block { flex: 1; display: flex; flex-direction: column; gap: 1px; }
.post-username {
  font-size: 13.5px; font-weight: 600;
  color: var(--ig-black);
  font-family: var(--ig-font);
  display: flex; align-items: center; gap: 4px;
  line-height: 1.2;
}
.post-verified {
  display: inline-flex; align-items: center; justify-content: center;
  width: 14px; height: 14px;
  background: var(--ig-blue);
  border-radius: 50%;
  flex-shrink: 0;
}
.post-verified svg { width: 8px; height: 8px; }
.post-location {
  font-size: 11px; color: var(--ig-dark);
  font-family: var(--ig-font); font-weight: 400;
  line-height: 1.2; letter-spacing: -0.1px;
}
.post-more {
  font-size: 16px; color: var(--ig-dark);
  cursor: pointer; padding: 4px 0;
  display: flex; flex-direction: column; gap: 3px; align-items: center;
}
.post-more span {
  display: block; width: 4px; height: 4px;
  background: var(--ig-dark); border-radius: 50%;
}

/* Post image */
.post-img-wrap {
  flex: 1; min-height: 0;
  position: relative; background: #000;
  overflow: hidden;
}
.post-img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
}

/* Post actions */
.post-actions-area {
  flex-shrink: 0;
  background: #fff;
}
.post-actions-bar {
  display: flex; align-items: center;
  padding: 8px 14px 4px;
  gap: 16px;
}
.action-btn { cursor: pointer; display: flex; align-items: center; justify-content: center; }
.action-btn svg { display: block; }
.action-save { margin-left: auto; }

/* Like count */
.post-likes {
  padding: 0 14px 4px;
  font-size: 13.5px; font-weight: 600;
  color: var(--ig-black);
  font-family: var(--ig-font);
  line-height: 1.4;
}

/* Caption */
.post-caption {
  padding: 0 14px 4px;
  font-size: 13.5px;
  color: var(--ig-black);
  font-family: var(--ig-font);
  line-height: 1.5;
}
.caption-user { font-weight: 600; }
.caption-hashtag { color: var(--ig-blue); }

/* Comments */
.post-view-comments {
  padding: 0 14px 4px;
  font-size: 13.5px; color: var(--ig-medium);
  font-family: var(--ig-font); cursor: pointer;
  line-height: 1.5;
}

/* Add comment row */
.post-add-comment {
  padding: 5px 14px 6px;
  display: flex; align-items: center; gap: 10px;
  border-top: 0.5px solid #f5f5f5;
}
.comment-av {
  width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, #405de6, #833ab4, #e1306c);
}
.add-comment-text {
  font-size: 13.5px; color: var(--ig-medium);
  font-family: var(--ig-font);
  flex: 1;
}
.heart-emoji { font-size: 16px; cursor: pointer; }

/* Timestamp */
.post-timestamp {
  padding: 0 14px 8px;
  font-size: 10px; color: var(--ig-medium);
  font-family: var(--ig-font);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ── Bottom nav bar ── */
.ig-nav {
  height: 50px;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(10px);
  border-top: 0.5px solid var(--ig-border);
  display: flex; align-items: center;
  justify-content: space-around;
  padding: 0 8px;
  flex-shrink: 0;
}
.nav-btn {
  display: flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; cursor: pointer;
}
.nav-btn svg { display: block; }
.nav-profile-avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: linear-gradient(135deg, #405de6, #833ab4, #e1306c);
  border: 2px solid var(--ig-black);
}

/* ── Home indicator ── */
.home-indicator {
  position: absolute;
  bottom: 6px; left: 50%;
  transform: translateX(-50%);
  width: 126px; height: 5px;
  background: rgba(0,0,0,0.18);
  border-radius: 3px;
  z-index: 100;
}
</style>
</head>
<body>

<div class="phone-wrap">
  <div class="iphone">
    <!-- Physical buttons -->
    <div class="btn-mute"></div>
    <div class="btn-vol-u"></div>
    <div class="btn-vol-d"></div>
    <div class="btn-power"></div>

    <div class="screen">
      <!-- Screen glare overlay -->
      <div class="screen-glare"></div>

      <!-- Dynamic Island -->
      <div class="dynamic-island">
        <div class="di-dot small"></div>
        <div class="di-dot"></div>
      </div>

      <!-- Status bar — black text (over white IG header) -->
      <div class="status-bar">
        <span class="sb-time">9:41</span>
        <div class="sb-icons">
          <!-- Signal -->
          <svg width="17" height="11" viewBox="0 0 17 11" fill="none">
            <rect x="0"   y="6.5" width="2.5" height="4.5" rx="0.8" fill="#1a1a1a"/>
            <rect x="4"   y="4.5" width="2.5" height="6.5" rx="0.8" fill="#1a1a1a"/>
            <rect x="8"   y="2"   width="2.5" height="9"   rx="0.8" fill="#1a1a1a"/>
            <rect x="12"  y="0"   width="2.5" height="11"  rx="0.8" fill="#1a1a1a"/>
            <!-- carrier dot -->
            <circle cx="16.5" cy="9" r="1" fill="#1a1a1a"/>
          </svg>
          <!-- WiFi -->
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
            <circle cx="8" cy="10.5" r="1.6" fill="#1a1a1a"/>
            <path d="M4.8 7.4 C5.9 6.2 6.9 5.7 8 5.7 C9.1 5.7 10.1 6.2 11.2 7.4" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M2 4.5 C3.8 2.5 5.8 1.5 8 1.5 C10.2 1.5 12.2 2.5 14 4.5" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <!-- Battery -->
          <svg width="27" height="13" viewBox="0 0 27 13" fill="none">
            <rect x="0.5" y="1" width="22" height="11" rx="3.2" stroke="#1a1a1a" stroke-width="1.2"/>
            <rect x="22.8" y="4.2" width="2.2" height="4.6" rx="1" fill="#1a1a1a" opacity="0.35"/>
            <rect x="1.5" y="2" width="18.5" height="9" rx="2.2" fill="#1a1a1a"/>
          </svg>
        </div>
      </div>

      <!-- =================== INSTAGRAM APP =================== -->
      <div class="ig-app">

        <!-- Top header -->
        <div class="ig-top">
          <div class="ig-wordmark">Instagram</div>
          <div class="ig-top-icons">
            <!-- Heart/notifications -->
            <svg class="ig-icon" viewBox="0 0 24 24" fill="none">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5A5.5 5.5 0 0 1 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3A5.5 5.5 0 0 1 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <!-- Messenger/DM -->
            <svg class="ig-icon" viewBox="0 0 24 24" fill="none">
              <path d="M22 3L11 14M22 3l-7 19-4-9-9-4 19-7z"
                stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <!-- Stories row -->
        <div class="ig-stories-row">
          <!-- Your story -->
          <div class="story-cell">
            <div class="story-ring-wrap add-btn" style="position:relative;">
              <div class="story-ring-inner">
                <div class="story-avatar" style="background:linear-gradient(135deg,#667eea,#764ba2);">K</div>
              </div>
              <div class="story-add-icon"></div>
            </div>
            <span class="story-name you">Hikayeni</span>
          </div>
          <!-- klinik_demo -->
          <div class="story-cell">
            <div class="story-ring-wrap">
              <div class="story-ring-inner">
                <div class="story-avatar" style="background:linear-gradient(135deg,#405de6,#c13584,#fd1d1d);">K</div>
              </div>
            </div>
            <span class="story-name">klinik_demo</span>
          </div>
          <!-- hepsiclinic -->
          <div class="story-cell">
            <div class="story-ring-wrap">
              <div class="story-ring-inner">
                <div class="story-avatar" style="background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;">H</div>
              </div>
            </div>
            <span class="story-name">hepsiclinic</span>
          </div>
          <!-- ai_services -->
          <div class="story-cell">
            <div class="story-ring-wrap">
              <div class="story-ring-inner">
                <div class="story-avatar" style="background:linear-gradient(135deg,#f7971e,#ffd200);">A</div>
              </div>
            </div>
            <span class="story-name">ai_services</span>
          </div>
        </div>

        <!-- Thin divider -->
        <div class="feed-separator"></div>

        <!-- POST -->
        <div class="ig-post">

          <!-- Post header -->
          <div class="post-header">
            <div class="post-avatar-ring">
              <div class="post-avatar-inner">
                <div class="post-avatar-letter">K</div>
              </div>
            </div>
            <div class="post-user-block">
              <div class="post-username">
                klinik_demo
                <span class="post-verified">
                  <svg viewBox="0 0 10 10" fill="white">
                    <polyline points="2,5 4.2,7.2 8,3" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </span>
              </div>
              <div class="post-location">İstanbul, Turkey</div>
            </div>
            <div class="post-more">
              <span></span><span></span><span></span>
            </div>
          </div>
